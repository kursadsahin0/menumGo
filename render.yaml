databases:
  - name: menumgo-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: menumgo-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: WIFI_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: menumgo-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ACTIVATION_KEY
        sync: false
