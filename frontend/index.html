<!doctype html>
<html lang="tr">
  <head>
    <title><%= productName %> · Dijital QR menü</title>

    <meta charset="utf-8" />
    <meta
      name="description"
      content="Kafeler, restoranlar ve barlar için dijital QR menü. Misafir kodu okutur, menüyü telefonunda görür. Fiyat değişince menü de güncellenir."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1f3a34" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #1f3a34;
        color: #fff;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__inner {
        display: grid;
        gap: 18px;
        justify-items: center;
        text-align: center;
        animation: app-splash-in 0.55s ease both;
      }
      .app-splash__mark {
        width: 72px;
        height: 72px;
        color: #fff;
      }
      .app-splash__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .app-splash__name {
        margin: 0;
        font: 600 1.5rem/1.1 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: -0.04em;
      }
      .app-splash__pulse {
        width: 28px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      .app-splash__pulse::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #fff;
        animation: app-splash-bar 0.9s ease-in-out infinite;
      }
      @keyframes app-splash-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes app-splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__inner,
        .app-splash__pulse::after {
          animation: none;
        }
      }
    </style>
    <meta property="og:site_name" content="<%= productName %>" />
    <meta property="og:title" content="<%= productName %> · Dijital QR menü" />
    <meta
      property="og:description"
      content="Kafeler, restoranlar ve barlar için dijital QR menü. Misafir kodu okutur, menüyü telefonunda görür. Fiyat değişince menü de güncellenir."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:image" content="brand/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= productName %> · Dijital QR menü" />
    <meta
      name="twitter:description"
      content="Kafeler, restoranlar ve barlar için dijital QR menü. Misafir kodu okutur, menüyü telefonunda görür. Fiyat değişince menü de güncellenir."
    />
    <meta name="twitter:image" content="brand/logo.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no<% } %>"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png?v=3" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png?v=3" />
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="menümGo yükleniyor">
      <div class="app-splash__inner">
        <div class="app-splash__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M6 0h12a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6zm0 6h12v12H6V6zm3 3h6v6H9V9z"
            />
          </svg>
        </div>
        <p class="app-splash__name">menümGo</p>
        <div class="app-splash__pulse" aria-hidden="true"></div>
      </div>
    </div>
    <!-- quasar:entry-point -->
    <script>
      window.setTimeout(function () {
        var el = document.getElementById('app-splash')
        if (!el || el.dataset.done === '1') return
        el.dataset.done = '1'
        el.classList.add('app-splash--hide')
        window.setTimeout(function () {
          el.remove()
        }, 400)
      }, 8000)
    </script>
  </body>
</html>
