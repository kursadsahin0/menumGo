services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: menumgo
      POSTGRES_PASSWORD: menumgo
      POSTGRES_DB: menumgo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U menumgo -d menumgo']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://menumgo:menumgo@db:5432/menumgo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build: .
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
